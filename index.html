// ======================================================================
//  Engine tính toán ghép bài
// ======================================================================
function computeGangRun(lines, buHaoInTotal, toInToNguyen) {
  // 1. Area weight of each line
  const enriched = lines.map(l => {
    const dienTich = l.length * l.width; // mm²
    const weight = dienTich * l.sp_to_in;
    const toInCan = Math.ceil((l.sl + l.bu_hao_sx) / l.sp_to_in); // tờ in needed if alone
    return { ...l, dienTich, weight, toInCan };
  });

  const totalWeight = enriched.reduce((s, l) => s + l.weight, 0);

  // 2. Ratio per SP
  const withRatio = enriched.map(l => ({
    ...l,
    tyLe: totalWeight > 0 ? l.weight / totalWeight : 0,
  }));

  // 3. Physical numbers
  const maxToInCan = withRatio.length > 0 ? Math.max(...withRatio.map(l => l.toInCan)) : 0;
  const toInVatLy = maxToInCan + buHaoInTotal;
  const toNguyenVatLy = toInToNguyen > 0 ? toInVatLy / toInToNguyen : 0;

  // 4. Allocation per SP
  const allocated = withRatio.map(l => {
    const buHaoInSP = l.tyLe * buHaoInTotal;
    const toNguyenSP = toInToNguyen > 0
      ? (l.toInCan * l.tyLe + buHaoInSP) / toInToNguyen
      : 0;
    // SP physically produced on sheet  = to_in_vat_ly × sp_to_in
    const spPhysicalAvailable = toInVatLy * l.sp_to_in;
    const plannedScrap = Math.max(0, spPhysicalAvailable - l.sl);
    return {
      ...l,
      bu_hao_in_sp: buHaoInSP,
      to_nguyen_sp_allocated: toNguyenSP,
      sp_physical_on_sheet: spPhysicalAvailable,
      planned_scrap: plannedScrap,
    };
  });

  // 5. Check consistency
  const sumAllocated = allocated.reduce((s, l) => s + l.to_nguyen_sp_allocated, 0);
  const variance = toNguyenVatLy - sumAllocated; // waste from gang-run imperfection

  // 6. Utilization % = area demanded (SL × DT) / area printed on all physical sheets
  //    Area demanded per SP = DT_i × SL_i (only useful output, not including BHSX)
  //    Area printed     per SP = DT_i × SP/tờ_i × toInVatLy
  const totalAreaDemand = allocated.reduce((s, l) =>
    s + (l.dienTich * l.sl), 0);
  const totalAreaPotential = allocated.reduce((s, l) =>
    s + (l.dienTich * l.sp_to_in * toInVatLy), 0);
  const utilization = totalAreaPotential > 0
    ? (totalAreaDemand / totalAreaPotential) * 100
    : 0;

  return {
    lines: allocated,
    totalWeight,
    maxToInCan,
    toInVatLy,
    toNguyenVatLy,
    sumAllocated,
    variance,
    utilization,
    totalAreaDemand,
    totalAreaPotential,
  };
}

// ======================================================================
//  Sheet visualizer — SVG preview
// ======================================================================
function SheetVisualizer({ result, khoNguyen }) {
  if (result.lines.length === 0) return null;

  const [w, h] = khoNguyen.split('x').map(Number);
  const scale = 400 / Math.max(w, h);
  const sheetW = w * scale;
  const sheetH = h * scale;

  // Simple layout: fit each SP's rectangles across sheet based on their area ratio
  const colors = ['#00586F', '#A2D45E', '#00D4FF', '#F59E0B', '#D32F2F', '#9C27B0', '#009688'];

  // Naive placement: divide sheet into columns by ratio, show rectangles of SP size
  let xOffset = 0;
  const placements = result.lines.map((l, idx) => {
    const colWidth = sheetW * l.tyLe;
    const rectW = l.length * scale;
    const rectH = l.width * scale;
    const cols = Math.max(1, Math.floor(colWidth / rectW));
    const rows = Math.max(1, Math.floor(sheetH / rectH));
    const rects = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        rects.push({
          x: xOffset + c * rectW + 1,
          y: r * rectH + 1,
          w: rectW - 2,
          h: rectH - 2,
        });
      }
    }
    const seg = { rects, color: colors[idx % colors.length], label: l.ma, width: colWidth };
    xOffset += colWidth;
    return seg;
  });

  return (
    <div className="card">
      <div className="section-tag">
        <span className="section-tag-bar"></span>
        <span className="section-tag-text">Visual Preview · Sheet layout (minh họa)</span>
      </div>
      <h2 className="section-title" style={{fontSize:16}}>Minh họa bố trí SP trên khổ giấy {khoNguyen} mm</h2>
      <div className="sheet-svg-wrap">
        <svg className="sheet-svg" width={sheetW} height={sheetH} viewBox={`0 0 ${sheetW} ${sheetH}`}>
          {placements.map((seg, idx) => (
            <g key={idx}>
              {seg.rects.map((r, j) => (
                <rect key={j} x={r.x} y={r.y} width={r.w} height={r.h}
                  fill={seg.color} opacity="0.75" stroke="#fff" strokeWidth="1" />
              ))}
            </g>
          ))}
        </svg>
      </div>
      <div className="legend-sap" style={{marginTop:12}}>
        {placements.map((seg, idx) => (
          <div key={idx} className="legend-item">
            <div className="legend-dot" style={{background: seg.color}}></div>
            <span><strong>{seg.label}</strong> · {(result.lines[idx].tyLe*100).toFixed(1)}%</span>
          </div>
        ))}
      </div>
      <div className="info-callout" style={{marginTop:10}}>
        <strong>Lưu ý visual:</strong> Đây là minh họa khái niệm để KH hiểu nguyên lý phân chia diện tích.
        Thiết kế ghép bài thực tế do designer bố trí bằng Esko/Illustrator, hệ thống SAP chỉ lưu kết quả
        (SP/tờ in, tỷ lệ) chứ không vẽ lại.
      </div>
    </div>
  );
}

// Helper: trả về list cuộn giấy phù hợp cho 1 layer (cùng gsm + cùng type + đủ khổ rộng)
function getAvailablePapers(layerCode, khoYeuCauMm) {
  const ref = GIAY_LOAI_MASTER[layerCode];
  if (!ref) return [];
  return Object.values(GIAY_NGUYEN_LIEU).filter(p =>
    p.gsm === ref.gsm &&
    p.type === ref.type &&
    (!khoYeuCauMm || p.kho_rong >= khoYeuCauMm)
  ).sort((a, b) => a.kho_rong - b.kho_rong); // nhỏ trước (tối ưu tồn kho)
}

// Helper: chọn giấy mặc định cho 1 cấu trúc (cuộn nhỏ nhất đủ rộng)
function pickDefaultPapers(cauTrucCode, khoNgangSuDung) {
  const ct = CAU_TRUC_MASTER[cauTrucCode];
  if (!ct) return {};
  const out = {};
  ct.layers.forEach((ly, idx) => {
    const opts = getAvailablePapers(ly.code, khoNgangSuDung);
    if (opts.length > 0) out[idx] = opts[0].code;
  });
  return out;
}

// ======================================================================
//  Engine ghép bài sóng
// ======================================================================
function computeCorrugation(lines, params) {
  if (lines.length === 0) {
    return { lines:[], error:false, empty:true };
  }

  // 1. Constraint: tất cả SP phải có cùng cấu trúc giấy + kiểu sóng
  const cauTrucSet = [...new Set(lines.map(l => l.cau_truc))];
  if (cauTrucSet.length > 1) {
    return {
      lines:[], error:true,
      warning:`Không thể ghép ${lines.length} SP có ${cauTrucSet.length} cấu trúc giấy khác nhau. Chọn các SP có cùng cấu trúc (cùng kiểu sóng + cùng số lớp + cùng loại giấy).`,
    };
  }
  const cauTruc = CAU_TRUC_MASTER[cauTrucSet[0]];
  if (!cauTruc) {
    return { lines:[], error:true, warning:`Cấu trúc ${cauTrucSet[0]} chưa định nghĩa trong master.` };
  }

  // 2. Tổng width ngang + biên cắt giữa các SP (5mm/cặp)
  const totalWidth = lines.reduce((s, l) => s + l.width, 0);
  const bienCat = Math.max(0, lines.length - 1) * 5;
  const khoNgangSuDung = totalWidth + bienCat;

  // 3. Constraint khổ ngang
  const overWidth = khoNgangSuDung > params.kho_ngang_max;

  // 4. Mét cuộn cần riêng từng SP (m) = (chiều dài tấm × SL + bù hao SX) / 1000
  const enriched = lines.map(l => {
    const metCanSP = ((l.length * l.sl) + (l.bu_hao_sx * l.length)) / 1000;
    const dienTichTamM2 = (l.length * l.width) / 1_000_000;
    return { ...l, metCanSP, dienTichTamM2 };
  });

  // 5. Mét cuộn vật lý = max(mét cần) + bù hao đầu cuối cuộn (m)
  const maxMetCan = Math.max(...enriched.map(l => l.metCanSP));
  const metDaiVatLy = maxMetCan + (params.bu_hao_dau_cuon || 30);

  // 6. m² chạy thực = (kho_ngang_su_dung mm / 1000) × mét vật lý
  const tongDienTichRunM2 = (khoNgangSuDung / 1000) * metDaiVatLy;
  const tongDienTichKhoMaxM2 = (params.kho_ngang_max / 1000) * metDaiVatLy;

  // 7. Allocation per SP — theo trọng số diện tích thực dùng (width × mét cần riêng)
  const sumWeighted = enriched.reduce((s, l) => s + (l.width * l.metCanSP), 0);
  const allocated = enriched.map(l => {
    const tyLe = sumWeighted > 0 ? (l.width * l.metCanSP) / sumWeighted : 0;
    const dienTichSPCanM2 = l.dienTichTamM2 * l.sl;

    // Phế: SP cần ít hơn → vẫn chiếm width nhưng dư mét dài
    const phePhamM2 = ((metDaiVatLy - l.metCanSP) * l.width) / 1000;

    // BOM giấy phân bổ cho SP này (kg) — trỏ vào Material code thực tế đã chọn
    const bom = cauTruc.layers.map((layer, idx) => {
      const selectedCode = params.selected_papers && params.selected_papers[idx];
      const giayActual = selectedCode ? GIAY_NGUYEN_LIEU[selectedCode] : null;
      const giayRef = GIAY_LOAI_MASTER[layer.code];
      const gsm = giayActual ? giayActual.gsm : giayRef.gsm;
      const isSong = !!layer.flute;
      const takeUp = isSong ? SONG_TYPE_MASTER[layer.flute].take_up : 1.0;
      // Phân bổ theo tỷ lệ × tổng diện tích chạy
      const dienTichPhanBoM2 = tyLe * tongDienTichRunM2;
      const kg = (dienTichPhanBoM2 * gsm * takeUp) / 1000;
      return {
        layer_idx: idx,
        layer_code: layer.code,
        material: giayActual ? giayActual.code : `GIAY-${layer.code}`,
        material_name: giayActual ? giayActual.name : `Giấy ${layer.code} (chưa chọn cuộn)`,
        supplier: giayActual ? giayActual.supplier : '—',
        batch: giayActual ? giayActual.batch : '—',
        kho_rong_cuon: giayActual ? giayActual.kho_rong : null,
        ton_kho_kg: giayActual ? giayActual.ton_kho_kg : null,
        role: layer.role,
        gsm,
        take_up: takeUp,
        is_song: isSong,
        dien_tich_m2: dienTichPhanBoM2,
        kg,
      };
    });

    return { ...l, tyLe, dienTichSPCanM2, phePhamM2, bom };
  });

  // 8. Utilization = diện tích SP cần / diện tích chạy thực
  const tongDienTichSPCanM2 = allocated.reduce((s, l) => s + l.dienTichSPCanM2, 0);
  const utilization = tongDienTichRunM2 > 0
    ? (tongDienTichSPCanM2 / tongDienTichRunM2) * 100
    : 0;
  const utilKhoMax = tongDienTichKhoMaxM2 > 0
    ? (tongDienTichSPCanM2 / tongDienTichKhoMaxM2) * 100
    : 0;

  // 9. Thời gian chạy ước (phút)
  const thoiGianChayMin = (params.toc_do > 0) ? metDaiVatLy / params.toc_do : 0;

  return {
    lines: allocated,
    cauTruc,
    cauTrucCode: cauTrucSet[0],
    khoNgangMax: params.kho_ngang_max,
    khoNgangSuDung,
    bienCat,
    totalWidth,
    overWidth,
    metDaiVatLy,
    maxMetCan,
    tongDienTichRunM2,
    tongDienTichKhoMaxM2,
    tongDienTichSPCanM2,
    utilization,
    utilKhoMax,
    thoiGianChayMin,
    error: false,
    warning: overWidth ? `Tổng chiều rộng ${khoNgangSuDung}mm vượt khổ máy ${params.kho_ngang_max}mm — cần bỏ bớt SP hoặc đổi máy lớn hơn.` : null,
  };
}

// ======================================================================

function KPIBarSong({ result, selectedCount }) {
  const { khoNgangSuDung=0, khoNgangMax=0, metDaiVatLy=0, utilization=0, thoiGianChayMin=0, overWidth } = result;
  const utilPill = utilization >= 80 ? 'pill-ok' : utilization >= 60 ? 'pill-warn' : 'pill-bad';
  const widthPct = khoNgangMax > 0 ? Math.min(100, (khoNgangSuDung / khoNgangMax) * 100) : 0;

// ======================================================================
//  Paper Selection — Sóng (chọn cuộn giấy nguyên liệu thực tế cho từng layer)
// ======================================================================
function PaperSelectionSong({ result, selectedPapers, onChange }) {
  if (result.empty || result.lines.length === 0 || result.error) return null;

  const cauTruc = result.cauTruc;
  const khoYeuCau = result.khoNgangSuDung;

  // Tổng kg cần cho từng layer = sum BOM kg theo layer_idx
  const totalKgPerLayer = {};
  result.lines.forEach(l => {
    l.bom.forEach(b => {
      totalKgPerLayer[b.layer_idx] = (totalKgPerLayer[b.layer_idx] || 0) + b.kg;
    });
  });

  return (
    <div className="card">
      <div className="section-tag">
        <span className="section-tag-bar"></span>
        <span className="section-tag-text">Material Selection · Cuộn giấy nguyên liệu</span>
      </div>
      <h2 className="section-title">Chọn cuộn giấy thực tế cho từng lớp ({cauTruc.so_lop} lớp)</h2>

      <div className="paper-layer-grid">
        {cauTruc.layers.map((layer, idx) => {
          const opts = getAvailablePapers(layer.code, khoYeuCau);
          const selectedCode = selectedPapers[idx];
          const selectedObj = selectedCode ? GIAY_NGUYEN_LIEU[selectedCode] : null;
          const kgCan = totalKgPerLayer[idx] || 0;
          const isSong = !!layer.flute;
          const stockShortage = selectedObj && (selectedObj.ton_kho_kg < kgCan);

          return (
            <div key={idx} className={`paper-layer ${isSong ? 'is-song' : 'is-mat'}`}>
              <div className="paper-layer-head">
                <span className="paper-layer-num">L{idx+1}</span>
                <span className="paper-layer-role">{layer.role}</span>
                {isSong && <span className="pill pill-info" style={{marginLeft:'auto'}}>Sóng {layer.flute}</span>}
                {!isSong && <span className="pill pill-ok" style={{marginLeft:'auto'}}>Mặt</span>}
              </div>
              <div className="paper-layer-spec">
                Yêu cầu: <strong>{layer.code}</strong> · {GIAY_LOAI_MASTER[layer.code]?.gsm}gsm · Khổ ≥ {khoYeuCau}mm
              </div>
              <select
                value={selectedCode || ''}
                onChange={e => onChange({ ...selectedPapers, [idx]: e.target.value })}
                style={{marginTop:'8px'}}
              >
                <option value="">— Chọn cuộn giấy —</option>
                {opts.length === 0 && <option disabled>Không có cuộn nào đủ khổ</option>}
                {opts.map(p => (
                  <option key={p.code} value={p.code}>
                    {p.code} · {p.kho_rong}mm · {p.supplier} · Tồn {p.ton_kho_kg.toLocaleString()}kg
                  </option>
                ))}
              </select>

              {selectedObj && (
                <div className="paper-layer-info">
                  <div className="paper-info-row">
                    <span className="paper-info-label">Material</span>
                    <span className="paper-info-val mono">{selectedObj.code}</span>
                  </div>
                  <div className="paper-info-row">
                    <span className="paper-info-label">Supplier</span>
                    <span className="paper-info-val">{selectedObj.supplier}</span>
                  </div>
                  <div className="paper-info-row">
                    <span className="paper-info-label">Batch</span>
                    <span className="paper-info-val mono">{selectedObj.batch}</span>
                  </div>
                  <div className="paper-info-row">
                    <span className="paper-info-label">Khổ rộng cuộn</span>
                    <span className="paper-info-val">{selectedObj.kho_rong.toLocaleString()}mm</span>
                  </div>
                  <div className="paper-info-row">
                    <span className="paper-info-label">Tồn kho</span>
                    <span className="paper-info-val">{selectedObj.ton_kho_kg.toLocaleString()} kg</span>
                  </div>
                  <div className="paper-info-row paper-info-need">
                    <span className="paper-info-label">Cần cho lệnh này</span>
                    <span className="paper-info-val">
                      <strong style={{color: stockShortage ? 'var(--danger)' : 'var(--peacock)'}}>
                        {kgCan.toFixed(2)} kg
                      </strong>
                      {isSong && <span style={{fontSize:'10.5px', color:'var(--medium-gray)', marginLeft:'4px'}}>
                        (×{SONG_TYPE_MASTER[layer.flute].take_up} take-up)
                      </span>}
                    </span>
                  </div>
                  {stockShortage && (
                    <div className="warn-callout" style={{marginTop:'6px', padding:'6px 10px', fontSize:'11.5px'}}>
                      ⚠ Tồn kho không đủ — thiếu {(kgCan - selectedObj.ton_kho_kg).toFixed(2)} kg
                    </div>
                  )}
                </div>
              )}
              {!selectedObj && opts.length === 0 && (
                <div className="warn-callout" style={{marginTop:'8px', padding:'6px 10px', fontSize:'11.5px'}}>
                  ⚠ Không có cuộn {layer.code} nào đủ khổ {khoYeuCau}mm trong tồn kho.

              )}

          );
        })}

        <strong>Logic chọn giấy:</strong> Dropdown chỉ hiển thị các cuộn cùng gsm + cùng type (mặt/sóng) + đủ khổ rộng (≥ khổ ngang sử dụng <strong>{khoYeuCau}mm</strong>).
        Auto chọn cuộn nhỏ nhất đủ rộng để tối ưu tồn kho. Material code đã chọn sẽ được đẩy xuống <em>Component giấy</em> trong Child Production Order khi confirm lệnh.
      </div>
    </div>
  );
}

                <td className="num">{l.width.toLocaleString()}</td>

                <td className="num">{l.metCanSP.toFixed(1)}</td>

                      </div>
                    </div>
                  ))}
                </td>
              </tr>
            ))}
            <tr style={{background:'var(--light-gray)', fontWeight:600}}>
              <td colSpan="3">TỔNG</td>
              <td className="num">{result.maxMetCan.toFixed(1)} <span style={{fontSize:'10.5px',color:'var(--medium-gray)',fontWeight:400}}>(max)</span></td>

        <code>kg giấy mặt phân bổ_i = (Tỷ lệ_i × DT chạy m²) × gsm / 1000</code><br/>
        <code>kg giấy sóng phân bổ_i = (Tỷ lệ_i × DT chạy m²) × gsm × take_up / 1000</code> &nbsp;→&nbsp; push xuống Production Order BOM

function WidthVisualizerSong({ result }) {
  if (result.empty || result.lines.length === 0 || result.error) return null;

  const PX_PER_MM = 0.4; // scale
  const machineW = result.khoNgangMax * PX_PER_MM;
  const usedW = result.khoNgangSuDung * PX_PER_MM;
  const machineH = 80;
  const palette = ['#00586F', '#A2D45E', '#00D4FF', '#F59E0B', '#7E57C2', '#26A69A'];

  let xCursor = 0;
  const placements = result.lines.map((l, idx) => {
    const w = l.width * PX_PER_MM;
    const placement = {
      x: xCursor, w, color: palette[idx % palette.length],
      label: l.ma, ratio: l.tyLe, widthMm: l.width,
    };
    xCursor += w + 5 * PX_PER_MM; // 5mm biên cắt
    return placement;
  });
  const wasteW = machineW - usedW;

  return (
    <div className="card">
      <div className="section-tag">
        <span className="section-tag-bar"></span>
        <span className="section-tag-text">Layout · Khổ ngang máy sóng</span>
      </div>
      <h2 className="section-title">Bố cục SP trên khổ ngang máy ({result.khoNgangMax}mm)</h2>
      <div className="sheet-svg-wrap">
        <svg className="sheet-svg" width={machineW + 40} height={machineH + 60} viewBox={`0 0 ${machineW + 40} ${machineH + 60}`}>
          {/* Khung máy */}
          <rect x="20" y="20" width={machineW} height={machineH} fill="#FFFFFF" stroke="var(--peacock)" strokeWidth="2"/>
          {/* Vùng phế cạnh */}
          {wasteW > 1 && (
            <rect x={20 + usedW} y="20" width={wasteW} height={machineH}
              fill="url(#hatchSong)" />
          )}
          <defs>
            <pattern id="hatchSong" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
              <line x1="0" y="0" x2="0" y2="6" stroke="#F59E0B" strokeWidth="1" opacity="0.5"/>
            </pattern>
          </defs>
          {/* SP placements */}
          {placements.map((p, idx) => (
            <g key={idx}>
              <rect x={20 + p.x} y="20" width={p.w} height={machineH}
                fill={p.color} fillOpacity="0.85" stroke="#FFFFFF" strokeWidth="1"/>
              <text x={20 + p.x + p.w/2} y={20 + machineH/2 - 4} textAnchor="middle"
                fill="#FFFFFF" fontSize="11" fontWeight="600" fontFamily="Montserrat">
                {p.label}
              </text>
              <text x={20 + p.x + p.w/2} y={20 + machineH/2 + 12} textAnchor="middle"
                fill="#FFFFFF" fontSize="10" opacity="0.95" fontFamily="Montserrat">
                {p.widthMm}mm · {(p.ratio*100).toFixed(0)}%
              </text>
            </g>
          ))}
          {/* Thước đo */}
          <text x="20" y="118" fontSize="10" fill="var(--medium-gray)" fontFamily="Montserrat">0mm</text>
          <text x={20 + machineW - 30} y="118" fontSize="10" fill="var(--medium-gray)" fontFamily="Montserrat">{result.khoNgangMax}mm</text>
          {wasteW > 30 && (
            <text x={20 + usedW + wasteW/2} y="118" textAnchor="middle"
              fontSize="10" fill="var(--warning)" fontWeight="600" fontFamily="Montserrat">
              Phế cạnh: {(result.khoNgangMax - result.khoNgangSuDung)}mm
            </text>
          )}
        </svg>
      </div>
      <div className="legend-sap" style={{marginTop:14}}>
        {result.lines.map((l, idx) => (
          <div key={l.id} className="legend-item">
            <div className="legend-dot" style={{background: palette[idx % palette.length]}}></div>
            <span><strong>{l.ma}</strong> · width {l.width}mm · {(l.tyLe*100).toFixed(1)}%</span>
          </div>
        ))}
        <div className="legend-item">
          <div className="legend-dot" style={{background:'#F59E0B', opacity:0.5}}></div>
          <span>Phế cạnh máy</span>
        </div>
      </div>
      <div className="info-callout" style={{marginTop:14}}>
        <strong>Top-down view:</strong> Cuộn giấy đi qua máy theo chiều dọc (chiều dài). Khổ ngang máy cố định ({result.khoNgangMax}mm) — các SP xếp cạnh nhau theo chiều ngang, phế cạnh là phần còn dư không tận dụng.
        Chiều dài cuộn vật lý: <strong>{result.metDaiVatLy.toFixed(1)}m</strong>.
      </div>
    </div>
  );
}

function SAPPreviewSong({ result, params }) {
  if (result.empty || result.lines.length === 0 || result.error) return null;

  const parentId = useMemo(
    () => 'CRG-' + String(Math.floor(100000 + Math.random()*900000)),
    [result.lines.length, params.may_song, result.cauTrucCode]
  );
  const maySongObj = MAY_SONG_MASTER.find(m => m.code === params.may_song) || {};

  const today = new Date();
  const plus = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
  const fmtDate = (d) => `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${d.getFullYear()}`;
  const startDate = fmtDate(today);
  const endDate = fmtDate(plus(today, 1));

  // Parent CBO (technical) — bao gồm danh sách cuộn giấy thực tế đã chọn
  const selectedPaperList = result.cauTruc.layers.map((layer, idx) => {
    const code = params.selected_papers && params.selected_papers[idx];
    const obj = code ? GIAY_NGUYEN_LIEU[code] : null;
    return {
      layer_idx: idx,
      layer_role: layer.role,
      layer_spec: layer.code,
      material_selected: obj ? obj.code : null,

function OffsetCalculator() {
  const [demand, setDemand] = useState(SEED_DEMAND);
  const [params, setParams] = useState({
    kho_nguyen: '790x1090',
    may_in: 'FAM000643',
    thong_so_mau: 'CMYK_CMYK',
    bu_hao_in_total: 200,
  });

  const selectedLines = demand.filter(l => l.include);
  const result = useMemo(() => {
    if (selectedLines.length === 0) {
      return {
        lines: [], totalWeight: 0, maxToInCan: 0, toInVatLy: 0,
        toNguyenVatLy: 0, sumAllocated: 0, variance: 0, utilization: 0,
        totalAreaDemand: 0, totalAreaPotential: 0,
      };
    }
    const toInToNguyen = selectedLines[0].to_in_to_nguyen || 1;
    return computeGangRun(selectedLines, params.bu_hao_in_total, toInToNguyen);
  }, [demand, params]);

  const toggleInclude = (id) => setDemand(demand.map(l => l.id === id ? { ...l, include: !l.include } : l));
  const removeLine = (id) => setDemand(demand.filter(l => l.id !== id));
  const addLine = () => {
    const newId = 'SO' + String(demand.length + 1).padStart(3, '0');
    setDemand([...demand, {
      id: newId, ma: `SP-NEW-${demand.length+1}`, ten: 'Sản phẩm mới', khach: 'Khách hàng mới',
      length: 200, width: 300, sp_to_in: 4, to_in_to_nguyen: 1,
      kho_nguyen: '790x1090', kho_in: '395x520',
      sl: 5000, bu_hao_sx: 150, thong_so_mau: 'CMYK_CMYK', kieu_in: 'Offset', include: true,
    }]);
  };

  return (
    <>
      <KPIBar result={result} selectedCount={selectedLines.length} />
      <DemandPool lines={demand} onChange={setDemand} onToggle={toggleInclude} onRemove={removeLine} onAdd={addLine} />
      <Parameters params={params} onChange={setParams} selectedLines={selectedLines} />
      <AllocationTable result={result} />
      <SheetVisualizer result={result} khoNguyen={params.kho_nguyen} />
      <SAPPreview result={result} params={params} />
    </>
  );
}

// ======================================================================
//  Corrugation Calculator
// ======================================================================
function CorrugationCalculator() {
  const [demand, setDemand] = useState(SEED_DEMAND_SONG);
  const [paramsBase, setParamsBase] = useState({
    may_song: 'SONG-2200',
    kho_ngang_max: 2200,
    toc_do: 150,
    bu_hao_dau_cuon: 30,
  });
  const [selectedPapers, setSelectedPapers] = useState({});

  const selectedLines = demand.filter(l => l.include);

  // Compute lần 1 (chưa có selected papers) — để biết khổ ngang sử dụng + cấu trúc
  const preResult = useMemo(
    () => computeCorrugation(selectedLines, { ...paramsBase, selected_papers: {} }),
    [demand, paramsBase]
  );

  // Auto-pick default papers khi cấu trúc / khổ ngang đổi
  useEffect(() => {
    if (preResult.error || preResult.empty || !preResult.cauTrucCode) return;
    const defaultPick = pickDefaultPapers(preResult.cauTrucCode, preResult.khoNgangSuDung);
    const currentLayers = preResult.cauTruc.layers.length;
    const selectedKeys = Object.keys(selectedPapers).map(Number);
    const needReset = selectedKeys.length !== currentLayers ||
      Object.values(selectedPapers).some(code => {
        const obj = GIAY_NGUYEN_LIEU[code];
        return !obj || obj.kho_rong < preResult.khoNgangSuDung;
      });
    if (needReset) {
      setSelectedPapers(defaultPick);
    }
    // eslint-disable-next-line
  }, [preResult.cauTrucCode, preResult.khoNgangSuDung]);

  // Compute lần 2 với selected papers
  const params = { ...paramsBase, selected_papers: selectedPapers };
  const result = useMemo(
    () => computeCorrugation(selectedLines, params),
    [demand, paramsBase, selectedPapers]
  );

  const toggleInclude = (id) => setDemand(demand.map(l => l.id === id ? { ...l, include: !l.include } : l));
  const removeLine = (id) => setDemand(demand.filter(l => l.id !== id));
  const addLine = () => {
    const newId = 'CRG' + String(demand.length + 1).padStart(3, '0');
    setDemand([...demand, {
      id: newId, so_number: `SO-2026-${String(200 + demand.length).padStart(4,'0')}`, so_item: 10,
      ma: `CTN-NEW-${demand.length+1}`, ten: 'Carton mới', khach: 'Khách hàng mới',
      length: 600, width: 400, height: 200,
      cau_truc: '3L_B_K200_M125_K150', sl: 1000, bu_hao_sx: 30, include: true,
    }]);
  };

  return (
    <>
      <KPIBarSong result={result} selectedCount={selectedLines.length} />
      <DemandPoolSong lines={demand} onChange={setDemand} onToggle={toggleInclude} onRemove={removeLine} onAdd={addLine} />
      <ParametersSong params={paramsBase} onChange={setParamsBase} selectedLines={selectedLines} />
      <PaperSelectionSong result={result} selectedPapers={selectedPapers} onChange={setSelectedPapers} />
      <AllocationTableSong result={result} />
      <WidthVisualizerSong result={result} />
      <SAPPreviewSong result={result} params={params} />
    </>
  );
}

            className={`tab ${activeTab === 'song' ? 'active' : ''}`}
            onClick={() => setActiveTab('song')}
          >
            Ghép bài sóng (Corrugation)
          </button>
        </div>

        {activeTab === 'offset' ? <OffsetCalculator /> : <CorrugationCalculator />}

        <div className="card-flat">
          <details>
            <summary>Giải thích architecture cho KH (click để mở)</summary>
            <div style={{marginTop:12, lineHeight:1.7}}>
              <p><strong style={{color:'var(--peacock)'}}>1. Layer chuẩn SAP S/4HANA Public Cloud:</strong></p>
              <ul>
                <li><strong>Sales Order</strong> — nguồn demand, không custom</li>
                <li><strong>Material Master</strong> + custom fields (khổ trải, kiểu in, SP/tờ in, cấu trúc giấy, kiểu sóng) qua Key User Extensibility</li>
                <li><strong>BOM & Routing</strong> — chuẩn, nhưng BOM qty các component bị override ở PO khi ghép bài</li>
                <li><strong>Production Order</strong> — Child PO = PO chuẩn, tạo qua A2X API từ tool ghép bài</li>
                <li><strong>PRT (Production Resource/Tool)</strong> — dùng cho kẽm + khuôn (in offset) và trục sóng (corrugation), chuẩn SAP</li>
                <li><strong>Work Center</strong> — máy in / máy sóng, chuẩn SAP</li>
                <li><strong>Settlement & Costing</strong> — đi theo từng Child PO, chuẩn SAP, không custom</li>
              </ul>
              <p><strong style={{color:'var(--peacock)'}}>2. Layer custom (trên Developer Extensibility — RAP / ABAP Cloud):</strong></p>
              <ul>
                <li><strong>Packaging Planning Worksheet</strong> (Custom Fiori app) — tool này chính là UI mockup, dùng cho cả 2 công đoạn in & sóng</li>
                <li><strong>Parent CBOs</strong> — <code>ZGangRunOrder</code> (in) và <code>ZCorrugationOrder</code> (sóng), gom Child POs theo từng lệnh ghép</li>
                <li><strong>Allocation Engines</strong> — 2 engine riêng cho 2 logic ghép khác nhau (diện tích × SP/tờ vs. width × mét cuộn × take-up)</li>
                <li><strong>Mapping CBOs</strong> — Thông số màu, Cấu trúc giấy, Take-up factor sóng (không có sẵn chuẩn)</li>
                <li><strong>Integration với MES</strong> — push parent info, nhận confirmation, phân bổ GI giấy theo allocation</li>
              </ul>
              <p><strong style={{color:'var(--peacock)'}}>3. Đặc điểm thiết kế:</strong></p>
              <ul>
                <li>Cùng kiến trúc Parent CBO + Child PO chuẩn cho cả 2 công đoạn — đồng nhất, dễ training & vận hành</li>
                <li>BOM override pattern áp được cho cả single-component (giấy in) và multi-component (giấy mặt + giấy sóng × N)</li>
                <li>KPI utilization & variance — đo lường chất lượng ghép bài theo thời gian, áp được cho cả 2 logic</li>
                <li>Costing tự động qua SAP Settlement, không cần custom allocation FI</li>
              </ul>
            </div>
          </details>
        </div>

        <div className="gi-bar">
          <div className="gi-blue"></div>
          <div className="gi-green"></div>
        </div>
        <div className="foot-note">
          <strong>Citek ▸</strong> Gang-Run Calculator (Offset + Corrugation) · ITP Presales Demo ·
          SAP S/4HANA Public Cloud + Developer Extensibility (RAP)
        </div>

      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
