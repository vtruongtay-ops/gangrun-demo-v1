// ======================================================================

function computeGangRun(lines, buHaoInTotal, toInToNguyen) {
  // 1. Area weight of each line
  const enriched = lines.map(l => {
    const dienTich = l.length * l.width; // mm²
    const weight = dienTich * l.sp_to_in;
    const toInCan = Math.ceil((l.sl + l.bu_hao_sx) / l.sp_to_in); // tờ in needed if alone
    return { ...l, dienTich, weight, toInCan };
  });

  const totalWeight = enriched.reduce((s, l) => s + l.weight, 0);

  // 2. Ratio per SP
  const withRatio = enriched.map(l => ({
    ...l,
    tyLe: totalWeight > 0 ? l.weight / totalWeight : 0,
  }));

  // 3. Physical numbers
  const maxToInCan = withRatio.length > 0 ? Math.max(...withRatio.map(l => l.toInCan)) : 0;
  const toInVatLy = maxToInCan + buHaoInTotal;
  const toNguyenVatLy = toInToNguyen > 0 ? toInVatLy / toInToNguyen : 0;

  // 4. Allocation per SP
  const allocated = withRatio.map(l => {
    const buHaoInSP = l.tyLe * buHaoInTotal;
    const toNguyenSP = toInToNguyen > 0
      ? (l.toInCan * l.tyLe + buHaoInSP) / toInToNguyen
      : 0;
    // SP physically produced on sheet  = to_in_vat_ly × sp_to_in
    const spPhysicalAvailable = toInVatLy * l.sp_to_in;
    const plannedScrap = Math.max(0, spPhysicalAvailable - l.sl);
    return {
      ...l,
      bu_hao_in_sp: buHaoInSP,
      to_nguyen_sp_allocated: toNguyenSP,
      sp_physical_on_sheet: spPhysicalAvailable,
      planned_scrap: plannedScrap,
    };
  });

  // 5. Check consistency
  const sumAllocated = allocated.reduce((s, l) => s + l.to_nguyen_sp_allocated, 0);
  const variance = toNguyenVatLy - sumAllocated; // waste from gang-run imperfection

  // 6. Utilization % = area demanded (SL × DT) / area printed on all physical sheets
  //    Area demanded per SP = DT_i × SL_i (only useful output, not including BHSX)
  //    Area printed     per SP = DT_i × SP/tờ_i × toInVatLy
  const totalAreaDemand = allocated.reduce((s, l) =>
    s + (l.dienTich * l.sl), 0);
  const totalAreaPotential = allocated.reduce((s, l) =>
    s + (l.dienTich * l.sp_to_in * toInVatLy), 0);
  const utilization = totalAreaPotential > 0
    ? (totalAreaDemand / totalAreaPotential) * 100
    : 0;

  return {
    lines: allocated,
    totalWeight,
    maxToInCan,
    toInVatLy,
    toNguyenVatLy,
    sumAllocated,
    variance,
    utilization,
    totalAreaDemand,
    totalAreaPotential,
  };
}

// ======================================================================
//  Sheet visualizer — SVG preview
// ======================================================================
function SheetVisualizer({ result, khoNguyen }) {
  if (result.lines.length === 0) return null;

  const [w, h] = khoNguyen.split('x').map(Number);
  const scale = 400 / Math.max(w, h);
  const sheetW = w * scale;
  const sheetH = h * scale;

  // Simple layout: fit each SP's rectangles across sheet based on their area ratio
  const colors = ['#00586F', '#A2D45E', '#00D4FF', '#F59E0B', '#D32F2F', '#9C27B0', '#009688'];

  // Naive placement: divide sheet into columns by ratio, show rectangles of SP size
  let xOffset = 0;
  const placements = result.lines.map((l, idx) => {
    const colWidth = sheetW * l.tyLe;
    const rectW = l.length * scale;
    const rectH = l.width * scale;
    const cols = Math.max(1, Math.floor(colWidth / rectW));
    const rows = Math.max(1, Math.floor(sheetH / rectH));
    const rects = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        rects.push({
          x: xOffset + c * rectW + 1,
          y: r * rectH + 1,
          w: rectW - 2,
          h: rectH - 2,
        });
      }
    }
    const seg = { rects, color: colors[idx % colors.length], label: l.ma, width: colWidth };
    xOffset += colWidth;
    return seg;
  });

  return (
    <div className="card">
      <div className="section-tag">
        <span className="section-tag-bar"></span>
        <span className="section-tag-text">Visual Preview · Sheet layout (minh họa)</span>
      </div>
      <h2 className="section-title" style={{fontSize:16}}>Minh họa bố trí SP trên khổ giấy {khoNguyen} mm</h2>
      <div className="sheet-svg-wrap">
        <svg className="sheet-svg" width={sheetW} height={sheetH} viewBox={`0 0 ${sheetW} ${sheetH}`}>
          {placements.map((seg, idx) => (
            <g key={idx}>
              {seg.rects.map((r, j) => (
                <rect key={j} x={r.x} y={r.y} width={r.w} height={r.h}
                  fill={seg.color} opacity="0.75" stroke="#fff" strokeWidth="1" />
              ))}
            </g>
          ))}
        </svg>
      </div>
      <div className="legend-sap" style={{marginTop:12}}>
        {placements.map((seg, idx) => (
          <div key={idx} className="legend-item">
            <div className="legend-dot" style={{background: seg.color}}></div>
            <span><strong>{seg.label}</strong> · {(result.lines[idx].tyLe*100).toFixed(1)}%</span>
          </div>
        ))}
      </div>
      <div className="info-callout" style={{marginTop:10}}>
        <strong>Lưu ý visual:</strong> Đây là minh họa khái niệm để KH hiểu nguyên lý phân chia diện tích.
        Thiết kế ghép bài thực tế do designer bố trí bằng Esko/Illustrator, hệ thống SAP chỉ lưu kết quả
        (SP/tờ in, tỷ lệ) chứ không vẽ lại.
      </div>
    </div>
  );
}

            <div className="po-meta-label">Thông số màu</div>
            <div className="po-meta-value">{mauObj.desc || params.thong_so_mau}</div>
          </div>
          <div className="po-meta">
            <div className="po-meta-label">Số kẽm (PRT)</div>
            <div className="po-meta-value"><span className="accent-num">{soKem}</span> <span style={{fontSize:'11px',color:'var(--medium-gray)',fontWeight:400}}>kẽm</span></div>
          </div>
          <div className="po-meta">
            <div className="po-meta-label">Planned Start</div>
            <div className="po-meta-value">{startDate}</div>
          </div>
          <div className="po-meta">
            <div className="po-meta-label">Planned End</div>
            <div className="po-meta-value">{endDate}</div>
          </div>

          <div className="po-meta">
            <div className="po-meta-label">Tờ in vật lý</div>
            <div className="po-meta-value"><span className="accent-num">{Math.round(result.toInVatLy).toLocaleString()}</span> <span style={{fontSize:'11px',color:'var(--medium-gray)',fontWeight:400}}>tờ</span></div>
          </div>
          <div className="po-meta">
            <div className="po-meta-label">Tờ nguyên vật lý</div>
            <div className="po-meta-value"><span className="accent-num">{result.toNguyenVatLy.toFixed(2)}</span> <span style={{fontSize:'11px',color:'var(--medium-gray)',fontWeight:400}}>tờ</span></div>
          </div>
          <div className="po-meta">
            <div className="po-meta-label">Bù hao in (gộp)</div>
            <div className="po-meta-value"><span className="accent-num">{params.bu_hao_in_total.toLocaleString()}</span> <span style={{fontSize:'11px',color:'var(--medium-gray)',fontWeight:400}}>tờ</span></div>
          </div>
          <div className="po-meta">
            <div className="po-meta-label">Utilization</div>
            <div className="po-meta-value"><span className="accent-num">{result.utilization.toFixed(1)}</span>%</div>
          </div>
          <div className="po-meta">
            <div className="po-meta-label">Child POs</div>
            <div className="po-meta-value"><span className="accent-num">{result.lines.length}</span> <span style={{fontSize:'11px',color:'var(--medium-gray)',fontWeight:400}}>lệnh</span></div>
          </div>
          <div className="po-meta">
            <div className="po-meta-label">Created By / On</div>
            <div className="po-meta-value" style={{fontSize:'12.5px'}}>PP Planner · {startDate}</div>
          </div>
        </div>
      </div>

      {/* Child POs — readable table */}
      <div className="po-children-wrap">
        <div className="po-children-head">
          <span>▸ Child Production Orders · Standard SAP Production Order</span>
          <span className="count">{result.lines.length} PO</span>
        </div>
        <table className="data po-children">
          <thead>
            <tr>
              <th style={{width:'15%'}}>Child PO</th>
              <th style={{width:'22%'}}>Thành phẩm (Material)</th>
              <th style={{width:'11%'}}>Khách hàng</th>
              <th className="num" style={{width:'9%'}}>Order Qty</th>
              <th style={{width:'20%'}}>Component giấy in</th>
              <th style={{width:'13%'}}>PRT (khuôn · kẽm)</th>
              <th className="num" style={{width:'10%'}}>Planned Scrap</th>
            </tr>
          </thead>
          <tbody>
            {result.lines.map((l, idx) => {
              const childPo = `PO-${parentId}-${String(idx+1).padStart(2,'0')}`;
              return (
                <tr key={childPo}>
                  <td>
                    <div className="po-child-id">{childPo}</div>
                    <div style={{fontSize:'10.5px',color:'var(--medium-gray)',marginTop:'2px'}}>
                      <span className="pill pill-ok" style={{fontSize:'9.5px',padding:'1px 6px'}}>Released</span>
                    </div>
                  </td>
                  <td>
                    <div className="po-mat-code">{l.ma}</div>
                    <div className="po-mat-desc">{l.ten}</div>
                  </td>
                  <td style={{fontSize:'11.5px'}}>{l.khach}</td>
                  <td className="num">
                    <strong>{l.sl.toLocaleString()}</strong>
                    <div style={{fontSize:'10.5px',color:'var(--medium-gray)'}}>EA</div>
                  </td>
                  <td>
                    <div className="po-comp-line">
                      <span className="code">GIAY-{params.kho_nguyen}</span>
                    </div>
                    <div className="po-comp-line" style={{marginTop:'2px'}}>
                      <strong>{l.to_nguyen_sp_allocated.toFixed(2)}</strong> <span style={{color:'var(--medium-gray)'}}>TO</span>
                      <span className="override">BOM override</span>
                    </div>
                    <div className="po-comp-line" style={{color:'var(--medium-gray)',fontSize:'10.5px',marginTop:'2px'}}>
                      Tỷ lệ diện tích: {(l.tyLe*100).toFixed(2)}% · Bù hao: {l.bu_hao_in_sp.toFixed(1)} tờ
                    </div>
                  </td>
                  <td>
                    <div className="po-prt-line"><span className="tag">KHUÔN</span>{l.ma}</div>
                    <div className="po-prt-line" style={{marginTop:'3px'}}><span className="tag">KẼM</span>{params.thong_so_mau}</div>
                  </td>
                  <td className="num">
                    <strong>{Math.round(l.planned_scrap).toLocaleString()}</strong>
                    <div style={{fontSize:'10.5px',color:'var(--medium-gray)'}}>EA (phế)</div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      <div className="info-callout">
        <strong>Cách đọc:</strong> Parent Gang-Run Order là một <em>Custom Business Object</em> — không tạo Production Order chuẩn, chỉ gom nhóm và truyền thông tin xuống MES.
        Mỗi Child PO là <em>Production Order chuẩn SAP</em> — có BOM, Routing, Costing, Settlement riêng về từng Material thành phẩm.
        Component giấy in trên mỗi Child PO được <strong>override số lượng</strong> theo kết quả phân bổ ghép bài (không dùng BOM qty mặc định).
      </div>

      {/* ===================== TECHNICAL JSON VIEW ===================== */}
      <div className="po-section-divider" style={{marginTop:'22px'}}>
        <span className="lbl">Technical Payload · SAP API Integration</span>
        <span className="line"></span>
      </div>

      <div className="legend-sap">
        <div className="legend-item"><div className="legend-dot" style={{background:'var(--peacock)'}}></div><span>Custom Business Object (RAP)</span></div>
        <div className="legend-item"><div className="legend-dot" style={{background:'var(--lime)'}}></div><span>Standard Production Order (A2X API)</span></div>
        <div className="legend-item"><div className="legend-dot" style={{background:'var(--cyan)'}}></div><span>Override BOM Quantity (custom logic)</span></div>
      </div>

      <div className="two-col">
        <div>
          <h4 style={{margin:'0 0 8px 0', color:'var(--peacock)'}}>▸ Parent CBO payload</h4>
          <pre className="json-view">{parentJson}</pre>
          <div className="info-callout">
            Payload gửi vào <code>ZGangRunOrder</code> (CBO dựng bằng RAP/ABAP Cloud). Không trigger Production Order chuẩn.
          </div>
        </div>
        <div>
          <h4 style={{margin:'0 0 8px 0', color:'var(--peacock)'}}>▸ Child POs payload</h4>
          <pre className="json-view">{childJson}</pre>
          <div className="info-callout">
            Gọi A2X API <code>API_PRODUCTION_ORDER_2</code> tạo Production Order chuẩn.
            BOM <code>component_giay_in.bom_qty_override</code> thay cho qty mặc định từ Material Master.
          </div>
        </div>
      </div>
    </div>
  );
}

// ======================================================================
//  App
// ======================================================================
function App() {
  const [demand, setDemand] = useState(SEED_DEMAND);
  const [params, setParams] = useState({
    kho_nguyen: '790x1090',
    may_in: 'FAM000643',
    thong_so_mau: 'CMYK_CMYK',
    bu_hao_in_total: 200,
  });

  const selectedLines = demand.filter(l => l.include);

  const result = useMemo(() => {
    if (selectedLines.length === 0) {
      return {
        lines: [], totalWeight: 0, maxToInCan: 0, toInVatLy: 0,
        toNguyenVatLy: 0, sumAllocated: 0, variance: 0, utilization: 0,
        totalAreaDemand: 0, totalAreaPotential: 0,
      };
    }
    const toInToNguyen = selectedLines[0].to_in_to_nguyen || 1;
    return computeGangRun(selectedLines, params.bu_hao_in_total, toInToNguyen);
  }, [demand, params]);

  const toggleInclude = (id) => {
    setDemand(demand.map(l => l.id === id ? { ...l, include: !l.include } : l));
  };
  const removeLine = (id) => {
    setDemand(demand.filter(l => l.id !== id));
  };
  const addLine = () => {
    const newId = 'SO' + String(demand.length + 1).padStart(3, '0');
    setDemand([...demand, {
      id: newId, ma: `SP-NEW-${demand.length+1}`, ten: 'Sản phẩm mới', khach: 'Khách hàng mới',
      length: 200, width: 300, sp_to_in: 4, to_in_to_nguyen: 1,
      kho_nguyen: '790x1090', kho_in: '395x520',
      sl: 5000, bu_hao_sx: 150, thong_so_mau: 'CMYK_CMYK', kieu_in: 'Offset', include: true,
    }]);
  };

  return (
    <div>
      <Header />
      <div className="main-container">

        <KPIBar result={result} selectedCount={selectedLines.length} />

        <DemandPool
          lines={demand}
          onChange={setDemand}
          onToggle={toggleInclude}
          onRemove={removeLine}
          onAdd={addLine}
        />

        <Parameters
          params={params}
          onChange={setParams}
          selectedLines={selectedLines}
        />

        <AllocationTable result={result} />

        <SheetVisualizer result={result} khoNguyen={params.kho_nguyen} />

        <SAPPreview result={result} params={params} />

        <div className="card-flat">
          <details>
            <summary>Giải thích architecture cho KH (click để mở)</summary>
            <div style={{marginTop:12, lineHeight:1.7}}>
              <p><strong style={{color:'var(--peacock)'}}>1. Layer chuẩn SAP S/4HANA Public Cloud:</strong></p>
              <ul>
                <li><strong>Sales Order</strong> — nguồn demand, không custom</li>
                <li><strong>Material Master</strong> + custom fields (khổ trải, kiểu in, SP/tờ in) qua Key User Extensibility</li>
                <li><strong>BOM & Routing</strong> — chuẩn, nhưng BOM qty giấy in bị override ở PO khi ghép bài</li>
                <li><strong>Production Order</strong> — Child PO = PO chuẩn, tạo qua A2X API từ tool ghép bài</li>
                <li><strong>PRT (Production Resource/Tool)</strong> — dùng cho kẽm + khuôn, chuẩn SAP</li>
                <li><strong>Work Center</strong> — máy in, chuẩn SAP</li>
                <li><strong>Settlement & Costing</strong> — đi theo từng Child PO, chuẩn SAP, không custom</li>
              </ul>
              <p><strong style={{color:'var(--peacock)'}}>2. Layer custom (trên Developer Extensibility — RAP / ABAP Cloud):</strong></p>
              <ul>
                <li><strong>Packaging Planning Worksheet</strong> (Custom Fiori app) — tool này chính là UI mockup</li>
                <li><strong>Parent CBO "Gang-Run Order"</strong> — gom Child POs, lưu thông tin in chung</li>
                <li><strong>Allocation Engine</strong> — tính tỷ lệ diện tích + override BOM qty</li>
                <li><strong>Mapping CBOs</strong> — Thông số màu, Số con/Khổ nguyên (không có sẵn chuẩn)</li>
                <li><strong>Integration với MES</strong> — push parent info, nhận confirmation, phân bổ GI giấy</li>
              </ul>
              <p><strong style={{color:'var(--peacock)'}}>3. Đặc điểm thiết kế:</strong></p>
              <ul>
                <li>Cấu trúc 2 tầng PPW → Production Order, gọn và dễ vận hành</li>
                <li>KPI utilization & variance — đo lường chất lượng ghép bài theo thời gian</li>
                <li>Tận dụng PRT chuẩn cho kẽm/khuôn — không cần mapping thủ công</li>
                <li>Costing tự động qua SAP Settlement, không cần custom allocation FI</li>
              </ul>
            </div>
          </details>
        </div>

        <div className="gi-bar">
          <div className="gi-blue"></div>
          <div className="gi-green"></div>
        </div>
        <div className="foot-note">
          <strong>Citek ▸</strong> Gang-Run Printing Calculator · ITP Presales Demo ·
          SAP S/4HANA Public Cloud + Developer Extensibility (RAP)
        </div>

      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
